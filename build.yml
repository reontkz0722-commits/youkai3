name: build-3gx

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4

      - name: Install git and libctrpf
        run: |
          (command -v git >/dev/null || (apt-get update && apt-get install -y git))
          dkp-pacman -Sy --noconfirm libctrpf

      - name: Get CTRPluginFramework BlankTemplate
        run: |
          git clone --depth 1 https://github.com/Nanquitas/CTRPluginFrameworkBlankTemplate.git tpl
          ls -la tpl tpl/Sources

      - name: Build
        run: |
          if [ -f main.cpp ]; then cp main.cpp tpl/Sources/main.cpp; else cp Sources/main.cpp tpl/Sources/main.cpp; fi
          cd tpl
          make

      - name: Upload 3gx
        uses: actions/upload-artifact@v4
        with:
          name: yw3_mapwarp
          path: tpl/*.3gx
