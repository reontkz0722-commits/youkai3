name: build-3gx

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get Nanquitas BlankTemplate (old CTRPF bundled in Lib/)
        run: |
          git clone --depth 1 https://github.com/Nanquitas/CTRPluginFramework-BlankTemplate.git yw3mapwarp
          if [ -f main.cpp ]; then cp main.cpp yw3mapwarp/Sources/main.cpp; else cp Sources/main.cpp yw3mapwarp/Sources/main.cpp; fi
          ls -la yw3mapwarp yw3mapwarp/Lib
          echo "=== Makefile ==="
          cat yw3mapwarp/Makefile

      - name: Build the ORIGINAL 3gxtool (Nanquitas, makes 3GX$0001) for Linux
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y libyaml-cpp-dev
          git clone --depth 1 https://github.com/Nanquitas/3gxtool.git tool_src
          ls -la tool_src tool_src/sources tool_src/includes
          mkdir -p tools shim
          # the repo ships a Windows-only yaml-cpp; use the system one through a tiny shim header
          echo '#include <yaml-cpp/yaml.h>' > shim/yaml.h
          g++ -std=gnu++17 -O2 -w -I"$PWD/shim" -I"$PWD/tool_src/includes" \
              tool_src/sources/*.cpp -o tools/3gxtool_old -lyaml-cpp
          ls -la tools

      - name: Get newer 3gxtool from the current devkitARM image (fallback, makes 3GX$0002)
        continue-on-error: true
        run: |
          mkdir -p tools
          docker run --rm -v "$PWD/tools:/out" devkitpro/devkitarm bash -c '
            grep -Fxq "[thepixellizeross-lib]" /opt/devkitpro/pacman/etc/pacman.conf || printf "\n[thepixellizeross-lib]\nServer = https://thepixellizeross.gitlab.io/packages/any\nSigLevel = Optional\n\n[thepixellizeross-linux]\nServer = https://thepixellizeross.gitlab.io/packages/x86_64/linux\nSigLevel = Optional\n" >> /opt/devkitpro/pacman/etc/pacman.conf
            dkp-pacman -Sy --noconfirm 3gxtool || dkp-pacman -S --noconfirm 3gxtool || true
            T=$(find / -type f -name 3gxtool -not -path "/proc/*" 2>/dev/null | head -1)
            cp "$T" /out/3gxtool_new
            chmod 755 /out/3gxtool_new
          '
          ls -la tools

      - name: Compile with the old devkitARM image (matches the old CTRPF library)
        run: |
          mkdir -p dummy
          cat > dummy/3gxtool <<'DUMMY'
          #!/bin/sh
          # fake 3gxtool: keep copies of the input files (make deletes them afterwards) and log the arguments
          echo "3gxtool args: $*" >> /work/dummy_args.txt
          mkdir -p /work/captured
          for a; do
            if [ -f "$a" ]; then
              case "$a" in *.plgInfo) ;; *) cp "$a" "/work/captured/$(basename "$a")" ;; esac
            fi
            last="$a"
          done
          : > "$last"
          exit 0
          DUMMY
          chmod 755 dummy/3gxtool
          docker run --rm -v "$PWD:/work" -w /work/yw3mapwarp nanquitas/devkitarm bash -c '
            export DEVKITPRO=${DEVKITPRO:-/opt/devkitpro}
            export DEVKITARM=${DEVKITARM:-$DEVKITPRO/devkitARM}
            export PATH="/work/dummy:$PATH"
            make
          '
          echo "--- arguments the Makefile passes to 3gxtool ---"
          cat dummy_args.txt || true
          ls -la captured || true
          file captured/* || true
          rm -f yw3mapwarp/yw3mapwarp.3gx

      - name: Make the real 3gx
        run: |
          sudo chown -R "$(id -u):$(id -g)" . || true
          test -f dummy_args.txt || { echo "the Makefile never called 3gxtool"; exit 1; }
          NEWARGS=""
          for t in $(tail -1 dummy_args.txt | sed 's/^3gxtool args: //'); do
            b=$(basename -- "$t")
            if [ -f "captured/$b" ]; then t="$PWD/captured/$b"; else t="${t/\/work\//$PWD/}"; fi
            NEWARGS="$NEWARGS $t"
          done
          echo "replaying: $NEWARGS"
          for TOOL in tools/3gxtool_old tools/3gxtool_new; do
            [ -x "$TOOL" ] || { echo "(no $TOOL)"; continue; }
            echo "=== trying $TOOL ==="
            rm -f yw3mapwarp/yw3mapwarp.3gx
            "./$TOOL" $NEWARGS || true
            if [ -s yw3mapwarp/yw3mapwarp.3gx ]; then
              echo "OK with $TOOL"
              head -c 8 yw3mapwarp/yw3mapwarp.3gx; echo
              break
            fi
          done
          ls -la yw3mapwarp
          test -s yw3mapwarp/yw3mapwarp.3gx

      - name: Upload 3gx
        uses: actions/upload-artifact@v4
        with:
          name: yw3_mapwarp
          path: yw3mapwarp/*.3gx
