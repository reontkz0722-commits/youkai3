name: build-3gx

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get Nanquitas BlankTemplate (old CTRPF bundled in Lib/)
        run: |
          git clone --depth 1 https://github.com/Nanquitas/CTRPluginFramework-BlankTemplate.git yw3mapwarp
          if [ -f main.cpp ]; then cp main.cpp yw3mapwarp/Sources/main.cpp; else cp Sources/main.cpp yw3mapwarp/Sources/main.cpp; fi
          ls -la yw3mapwarp yw3mapwarp/Lib
          grep -n 3gxtool yw3mapwarp/Makefile || true

      - name: Build the ORIGINAL 3gxtool (Nanquitas) from source
        continue-on-error: true
        run: |
          git clone --depth 1 https://github.com/Nanquitas/3gxtool.git tool_src
          ls -la tool_src
          cd tool_src
          mkdir -p ../tools
          if [ -f Makefile ] || [ -f makefile ]; then
            make -j2 || true
          elif [ -f CMakeLists.txt ]; then
            cmake -S . -B build && cmake --build build -j2 || true
          fi
          T=$(find . -type f -name 3gxtool -perm -u+x | head -1)
          if [ -z "$T" ]; then
            echo "no binary from make/cmake; compiling all .cpp files directly"
            g++ -std=c++17 -O2 -I. $(find . -name '*.cpp' -not -path './build/*') -o ../tools/3gxtool_old
          else
            cp "$T" ../tools/3gxtool_old
          fi
          ls -la ../tools

      - name: Get newer 3gxtool from the current devkitARM image (fallback)
        continue-on-error: true
        run: |
          mkdir -p tools
          docker run --rm -v "$PWD/tools:/out" devkitpro/devkitarm bash -c '
            grep -Fxq "[thepixellizeross-lib]" /opt/devkitpro/pacman/etc/pacman.conf || printf "\n[thepixellizeross-lib]\nServer = https://thepixellizeross.gitlab.io/packages/any\nSigLevel = Optional\n\n[thepixellizeross-linux]\nServer = https://thepixellizeross.gitlab.io/packages/x86_64/linux\nSigLevel = Optional\n" >> /opt/devkitpro/pacman/etc/pacman.conf
            dkp-pacman -Sy --noconfirm 3gxtool || dkp-pacman -S --noconfirm 3gxtool || true
            T=$(find / -type f -name 3gxtool -not -path "/proc/*" 2>/dev/null | head -1)
            cp "$T" /out/3gxtool_new
            chmod 755 /out/3gxtool_new
          '
          ls -la tools

      - name: Compile with the old devkitARM image (matches the old CTRPF library)
        run: |
          mkdir -p dummy
          cat > dummy/3gxtool <<'DUMMY'
          #!/bin/sh
          # fake 3gxtool: keep a copy of the ELF (make deletes it afterwards) and log the real arguments
          echo "3gxtool args: $*" >> /work/dummy_args.txt
          for a; do
            case "$a" in *.elf) cp "$a" /work/saved.elf ;; esac
            last="$a"
          done
          : > "$last"
          exit 0
          DUMMY
          chmod 755 dummy/3gxtool
          docker run --rm -v "$PWD:/work" -w /work/yw3mapwarp nanquitas/devkitarm bash -c '
            export DEVKITPRO=${DEVKITPRO:-/opt/devkitpro}
            export DEVKITARM=${DEVKITARM:-$DEVKITPRO/devkitARM}
            export PATH="/work/dummy:$PATH"
            make
          '
          echo "--- real 3gxtool arguments used by the Makefile ---"
          cat dummy_args.txt || true
          ls -la . yw3mapwarp
          rm -f yw3mapwarp/yw3mapwarp.3gx

      - name: Make the real 3gx
        run: |
          sudo chown -R "$(id -u):$(id -g)" . || true
          test -f saved.elf || { echo "saved.elf is missing: the compile step did not reach the 3gxtool call"; exit 1; }
          cd yw3mapwarp
          for TOOL in ../tools/3gxtool_old ../tools/3gxtool_new; do
            [ -x "$TOOL" ] || continue
            echo "=== trying $TOOL ==="
            if "$TOOL" -s ../saved.elf CTRPluginFramework.plgInfo yw3mapwarp.3gx && [ -s yw3mapwarp.3gx ]; then
              echo "OK with $TOOL"; break
            fi
            rm -f yw3mapwarp.3gx
          done
          ls -la
          test -s yw3mapwarp.3gx

      - name: Upload 3gx
        uses: actions/upload-artifact@v4
        with:
          name: yw3_mapwarp
          path: yw3mapwarp/*.3gx
